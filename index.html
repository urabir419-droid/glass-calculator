<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#000000">
  <meta name="description"
        content="A professional liquid glass calculator with a clean modern interface.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">

  <title>Liquid Calculator</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- App Icon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.08), transparent 28%),
        radial-gradient(circle at 80% 85%, rgba(90,120,255,.10), transparent 32%),
        #000;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100dvh;
      padding: 14px;

      -webkit-font-smoothing: antialiased;
    }

    /* Ambient liquid lights */

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      opacity: .35;
    }

    body::before {
      background: #315cff;
      top: -120px;
      left: -100px;
    }

    body::after {
      background: #7a35ff;
      bottom: -140px;
      right: -100px;
    }

    .calculator {
      position: relative;
      width: min(100%, 390px);
      padding: 18px;

      border-radius: 38px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.105),
          rgba(255,255,255,.035)
        );

      border: 1px solid rgba(255,255,255,.10);

      box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.10);

      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
    }

    /* subtle liquid highlight */

    .calculator::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 37px;
      pointer-events: none;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.08),
          transparent 35%,
          transparent 70%,
          rgba(255,255,255,.035)
        );
    }

    .top {
      position: relative;
      z-index: 2;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 2px 5px 12px;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.8px;
      color: rgba(255,255,255,.58);
    }

    .status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8cffd1;
      box-shadow: 0 0 14px rgba(140,255,209,.8);
    }

    /* Display */

    .display {
      position: relative;
      z-index: 2;

      min-height: 128px;

      padding: 18px 10px 16px;

      display: flex;
      align-items: flex-end;
      justify-content: flex-end;

      overflow: hidden;

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.018)
        );

      border: 1px solid rgba(255,255,255,.07);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    #expression {
      width: 100%;

      text-align: right;

      color: rgba(255,255,255,.96);

      font-size: clamp(42px, 11vw, 64px);
      font-weight: 300;

      line-height: 1;

      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;

      scrollbar-width: none;

      letter-spacing: -2px;
    }

    #expression::-webkit-scrollbar {
      display: none;
    }

    /* Buttons */

    .keys {
      position: relative;
      z-index: 2;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      margin-top: 12px;
    }

    button {
      position: relative;

      border: 0;
      outline: 0;

      height: 68px;

      border-radius: 50%;

      color: white;

      font-family: inherit;

      font-size: 24px;
      font-weight: 400;

      cursor: pointer;

      overflow: hidden;

      transition:
        transform .08s ease,
        filter .12s ease,
        background .12s ease;

      -webkit-touch-callout: none;
    }

    button::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.12),
          transparent 45%
        );

      opacity: .6;
      pointer-events: none;
    }

    button:active {
      transform: scale(.91);
      filter: brightness(.78);
    }

    .number {
      background:
        linear-gradient(
          145deg,
          rgba(65,65,70,.96),
          rgba(30,30,33,.96)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 5px 15px rgba(0,0,0,.18);
    }

    .function {
      background:
        linear-gradient(
          145deg,
          rgba(180,180,185,.92),
          rgba(120,120,125,.92)
        );

      color: #111;
    }

    .operator {
      background:
        linear-gradient(
          145deg,
          rgba(255,170,55,.98),
          rgba(235,105,10,.98)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 5px 18px rgba(255,125,20,.18);
    }

    .operator.active {
      background: white;
      color: #f28a17;
    }

    .zero {
      grid-column: span 2;

      border-radius: 38px;

      text-align: left;

      padding-left: 26px;
    }

    .equals {
      background:
        linear-gradient(
          145deg,
          rgba(110,125,255,.98),
          rgba(73,75,225,.98)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.2),
        0 7px 22px rgba(70,75,255,.22);
    }

    .bottom-space {
      height: 4px;
    }

    /* Small phones */

    @media (max-height: 700px) {
      .calculator {
        padding: 13px;
        border-radius: 32px;
      }

      .display {
        min-height: 100px;
      }

      button {
        height: 58px;
      }

      .keys {
        gap: 8px;
      }
    }

    @media (max-width: 350px) {
      .calculator {
        padding: 12px;
      }

      button {
        height: 60px;
        font-size: 21px;
      }

      .display {
        min-height: 105px;
      }
    }
  </style>
</head>

<body>

  <main class="calculator">

    <div class="top">
      <div class="title">LIQUID CALCULATOR</div>
      <div class="status"></div>
    </div>

    <div class="display">
      <div id="expression">0</div>
    </div>

    <div class="keys" id="keys">

      <button class="function" data-action="clear">AC</button>
      <button class="function" data-action="sign">±</button>
      <button class="function" data-action="percent">%</button>
      <button class="operator" data-value="/">÷</button>

      <button class="number" data-value="7">7</button>
      <button class="number" data-value="8">8</button>
      <button class="number" data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button class="number" data-value="4">4</button>
      <button class="number" data-value="5">5</button>
      <button class="number" data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button class="number" data-value="1">1</button>
      <button class="number" data-value="2">2</button>
      <button class="number" data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="number zero" data-value="0">0</button>
      <button class="number" data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>

    </div>

    <div class="bottom-space"></div>

  </main>

  <script>
    const display = document.getElementById("expression");
    const keys = document.getElementById("keys");

    let expression = "";
    let justCalculated = false;

    function render() {
      display.textContent = expression || "0";

      requestAnimationFrame(() => {
        display.scrollLeft = display.scrollWidth;
      });
    }

    function clearAll() {
      expression = "";
      justCalculated = false;
      render();
    }

    function addValue(value) {

      if (justCalculated) {
        expression = "";
        justCalculated = false;
      }

      expression += value;
      render();
    }

    function toggleSign() {

      if (!expression) return;

      if (expression.startsWith("-(") && expression.endsWith(")")) {
        expression = expression.slice(2, -1);
      } else {
        expression = "-(" + expression + ")";
      }

      render();
    }

    function percent() {

      if (!expression) return;

      try {
        const value = Function(
          '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(value)) {
          throw new Error();
        }

        expression = String(value / 100);
        render();

      } catch {
        showError();
      }
    }

    function showError() {
      expression = "Error";
      justCalculated = true;
      render();
    }

    function calculate() {

      if (!expression.trim()) return;

      if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
        showError();
        return;
      }

      try {

        let result = Function(
          '"use strict"; return (' + expression + ')'
        )();

        if (
          typeof result !== "number" ||
          !Number.isFinite(result)
        ) {
          showError();
          return;
        }

        result =
          Math.round((result + Number.EPSILON) * 1e10) / 1e10;

        expression = String(result);
        justCalculated = true;

        render();

      } catch {
        showError();
      }
    }

    keys.addEventListener("click", (event) => {

      const button = event.target.closest("button");

      if (!button) return;

      const action = button.dataset.action;
      const value = button.dataset.value;

      if (action === "clear") {
        clearAll();
        return;
      }

      if (action === "sign") {
        toggleSign();
        return;
      }

      if (action === "percent") {
        percent();
        return;
      }

      if (action === "equals") {
        calculate();
        return;
      }

      if (value !== undefined) {
        addValue(value);
      }

    });

    document.addEventListener("keydown", (event) => {

      const key = event.key;

      if (/^[0-9]$/.test(key)) {
        addValue(key);
        return;
      }

      if ("+-*/().".includes(key)) {
        addValue(key);
        return;
      }

      if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
        return;
      }

      if (key === "Escape") {
        clearAll();
        return;
      }

      if (key === "Backspace") {
        if (!justCalculated) {
          expression = expression.slice(0, -1);
          render();
        } else {
          clearAll();
        }
      }

    });

    render();
  </script>

</body>
</html>
