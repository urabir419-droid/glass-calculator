<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="description" content="Liquid Glass Calculator">

<title>Calculator</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --muted:#8e8e93;
  --orange:#ff9f0a;
  --key:rgba(255,255,255,.105);
  --key2:rgba(255,255,255,.07);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
  color:var(--text);
}

/* APP */

.app{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100%;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 18% 12%,
      rgba(80,105,255,.10),
      transparent 30%
    ),
    radial-gradient(
      circle at 86% 78%,
      rgba(150,70,255,.08),
      transparent 34%
    ),
    #000;
}

/* Liquid glow */

.glow{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  filter:blur(90px);
  pointer-events:none;
  opacity:.18;
  animation:floatGlow 9s ease-in-out infinite alternate;
}

.glow.one{
  background:#315cff;
  left:-150px;
  top:-100px;
}

.glow.two{
  background:#8b35ff;
  right:-160px;
  bottom:-130px;
  animation-delay:-4s;
}

@keyframes floatGlow{
  from{
    transform:translate3d(0,0,0) scale(1);
  }
  to{
    transform:translate3d(30px,20px,0) scale(1.15);
  }
}

/* MAIN */

.calculator{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  min-height:100dvh;

  display:flex;
  flex-direction:column;

  padding:
    calc(var(--safe-top) + 12px)
    14px
    calc(var(--safe-bottom) + 12px);
}

/* DISPLAY */

.display{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-end;

  padding:
    20px 12px
    clamp(18px,4vh,42px)
    12px;
}

.expression{
  width:100%;
  min-height:25px;

  text-align:right;

  color:#77777e;
  font-size:19px;
  font-weight:400;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  opacity:0;
  transform:translateY(6px);

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.expression.show{
  opacity:1;
  transform:none;
}

.result{
  width:100%;

  text-align:right;

  font-size:
    clamp(54px,15vw,92px);

  line-height:1;
  font-weight:300;
  letter-spacing:-2px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  transition:
    transform .16s ease,
    font-size .15s ease;
}

.result.pop{
  animation:numberPop .18s ease;
}

@keyframes numberPop{
  0%{
    transform:scale(.96);
  }
  65%{
    transform:scale(1.025);
  }
  100%{
    transform:scale(1);
  }
}

/* KEYPAD */

.keypad{
  flex:none;

  width:100%;
  max-width:500px;
  margin:0 auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:
    clamp(9px,2.6vw,14px);
}

/* BUTTON */

.key{
  position:relative;

  width:100%;
  aspect-ratio:1;

  border:0;
  outline:0;

  border-radius:50%;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.115),
      rgba(255,255,255,.045)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.11),
    inset 0 -8px 20px rgba(0,0,0,.20),
    0 7px 18px rgba(0,0,0,.28);

  border:
    1px solid rgba(255,255,255,.055);

  backdrop-filter:
    blur(28px)
    saturate(145%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(145%);

  transition:
    transform .09s cubic-bezier(.2,.8,.2,1),
    background .12s,
    box-shadow .12s;
}

/* glass shine */

.key::before{
  content:"";

  position:absolute;

  width:70%;
  height:38%;

  top:-15%;
  left:-8%;

  border-radius:50%;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.15),
      transparent
    );

  filter:blur(8px);

  opacity:.45;

  pointer-events:none;
}

/* ripple */

.key::after{
  content:"";

  position:absolute;

  width:20px;
  height:20px;

  border-radius:50%;

  background:rgba(255,255,255,.26);

  transform:scale(0);

  opacity:0;

  pointer-events:none;
}

.key.active::after{
  animation:ripple .38s ease-out;
}

@keyframes ripple{
  0%{
    transform:scale(.2);
    opacity:.5;
  }

  100%{
    transform:scale(7);
    opacity:0;
  }
}

.key.active{
  transform:scale(.91);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.20),
      rgba(255,255,255,.075)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 2px 7px rgba(0,0,0,.35);
}

/* NUMBER */

.number{
  position:relative;
  z-index:2;

  font-size:
    clamp(27px,8vw,36px);

  font-weight:400;

  letter-spacing:-.5px;
}

/* SMALL LETTERS */

.letters{
  position:absolute;

  bottom:21%;

  font-size:7px;
  letter-spacing:2px;

  color:#929298;
}

/* TOP KEYS */

.function{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.22),
      rgba(255,255,255,.10)
    );

  color:#000;
}

/* OPERATOR */

.operator{
  background:
    linear-gradient(
      145deg,
      #ffad22,
      #ff8c00
    );

  color:#fff;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    0 8px 24px rgba(255,159,10,.18);
}

.operator.active{
  color:var(--orange);

  background:#fff;

  box-shadow:
    0 5px 18px rgba(255,255,255,.18);
}

/* ZERO */

.zero{
  grid-column:span 2;
  aspect-ratio:auto;
  height:100%;

  border-radius:999px;

  justify-content:flex-start;

  padding-left:
    clamp(25px,7vw,34px);
}

/* FOOTER */

.footer{
  flex:none;

  height:9px;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  opacity:.3;
}

.home-indicator{
  width:115px;
  height:4px;

  border-radius:999px;

  background:#fff;
}

/* RESPONSIVE */

@media(max-height:650px){

  .display{
    padding-bottom:12px;
  }

  .keypad{
    gap:8px;
  }

  .calculator{
    padding-top:
      calc(var(--safe-top) + 6px);
    padding-bottom:
      calc(var(--safe-bottom) + 7px);
  }

}

@media(min-width:600px){

  .calculator{
    max-width:520px;
    margin:auto;
  }

}
</style>
</head>

<body>

<div class="app">

  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="calculator">

    <section class="display">

      <div
        id="expression"
        class="expression">
      </div>

      <div
        id="result"
        class="result">
        0
      </div>

    </section>


    <section class="keypad">

      <button
        class="key function"
        data-action="clear">
        <span class="number">AC</span>
      </button>

      <button
        class="key function"
        data-action="plusminus">
        <span class="number">±</span>
      </button>

      <button
        class="key function"
        data-action="percent">
        <span class="number">%</span>
      </button>

      <button
        class="key operator"
        data-value="/">
        <span class="number">÷</span>
      </button>


      <button
        class="key"
        data-value="7">
        <span class="number">7</span>
      </button>

      <button
        class="key"
        data-value="8">
        <span class="number">8</span>
      </button>

      <button
        class="key"
        data-value="9">
        <span class="number">9</span>
      </button>

      <button
        class="key operator"
        data-value="*">
        <span class="number">×</span>
      </button>


      <button
        class="key"
        data-value="4">
        <span class="number">4</span>
      </button>

      <button
        class="key"
        data-value="5">
        <span class="number">5</span>
      </button>

      <button
        class="key"
        data-value="6">
        <span class="number">6</span>
      </button>

      <button
        class="key operator"
        data-value="-">
        <span class="number">−</span>
      </button>


      <button
        class="key"
        data-value="1">
        <span class="number">1</span>
      </button>

      <button
        class="key"
        data-value="2">
        <span class="number">2</span>
      </button>

      <button
        class="key"
        data-value="3">
        <span class="number">3</span>
      </button>

      <button
        class="key operator"
        data-value="+">
        <span class="number">+</span>
      </button>


      <button
        class="key zero"
        data-value="0">
        <span class="number">0</span>
      </button>

      <button
        class="key"
        data-action="decimal">
        <span class="number">.</span>
      </button>

      <button
        class="key operator"
        data-action="equals">
        <span class="number">=</span>
      </button>

    </section>


    <footer class="footer">
      <div class="home-indicator"></div>
    </footer>

  </main>

</div>


<script>

/* =========================
   CALCULATOR ENGINE
========================= */

let current = "0";
let previous = null;
let operator = null;
let waiting = false;

const result =
  document.getElementById("result");

const expression =
  document.getElementById("expression");


/* =========================
   SOUND
========================= */

let audioContext = null;

function clickSound(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(
      165,
      audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      105,
      audioContext.currentTime + .035
    );

    gain.gain.setValueAtTime(
      .0001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .035,
      audioContext.currentTime + .004
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioContext.currentTime + .045
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(
      audioContext.currentTime + .05
    );

  }catch(e){}

}


/* =========================
   HAPTIC
========================= */

function haptic(){

  if(navigator.vibrate){

    navigator.vibrate(7);

  }

}


/* =========================
   FEEDBACK
========================= */

function feedback(button){

  clickSound();
  haptic();

  button.classList.remove("active");

  void button.offsetWidth;

  button.classList.add("active");

  setTimeout(()=>{
    button.classList.remove("active");
  },130);

}


/* =========================
   DISPLAY
========================= */

function update(){

  result.textContent =
    formatNumber(current);

  result.classList.remove("pop");

  void result.offsetWidth;

  result.classList.add("pop");

}


/* =========================
   FORMAT
========================= */

function formatNumber(value){

  if(value==="Error")
    return value;

  if(value.includes("e"))
    return value;

  let num=Number(value);

  if(!Number.isFinite(num))
    return "Error";

  if(
    Math.abs(num)>=1e12 ||
    (Math.abs(num)<1e-7 && num!==0)
  ){

    return num.toExponential(6);

  }

  let str=String(value);

  if(str.includes("."))
    return str;

  return Number(value).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:10
    }
  );

}


/* =========================
   DIGIT
========================= */

function inputDigit(digit){

  if(current==="Error"){
    current="0";
  }

  if(waiting){

    current=digit;
    waiting=false;

  }else{

    if(current==="0"){

      current=digit;

    }else{

      if(current.length<15)
        current+=digit;

    }

  }

  update();

}


/* =========================
   DECIMAL
========================= */

function decimal(){

  if(waiting){

    current="0.";
    waiting=false;

  }else if(!current.includes(".")){

    current+=".";

  }

  update();

}


/* =========================
   OPERATOR
========================= */

function chooseOperator(next){

  const input=
    Number(current);

  if(operator && waiting){
    operator=next;
    return;
  }

  if(previous===null){

    previous=input;

  }else if(operator){

    const resultValue=
      calculate(
        previous,
        input,
        operator
      );

    current=String(resultValue);
    previous=resultValue;

    update();

  }

  operator=next;
  waiting=true;

  expression.textContent=
    formatNumber(String(previous))
    +" "
    +displayOperator(next);

  expression.classList.add("show");

}


/* =========================
   CALCULATE
========================= */

function calculate(a,b,op){

  switch(op){

    case "+":
      return a+b;

    case "-":
      return a-b;

    case "*":
      return a*b;

    case "/":
      return b===0
        ?NaN
        :a/b;

    default:
      return b;

  }

}


/* =========================
   EQUALS
========================= */

function equals(){

  if(
    operator===null ||
    previous===null
  ){
    return;
  }

  const a=previous;
  const b=Number(current);

  const value=
    calculate(
      a,
      b,
      operator
    );

  expression.textContent=
    formatNumber(String(a))
    +" "
    +displayOperator(operator)
    +" "
    +formatNumber(String(b))
    +" =";

  expression.classList.add("show");

  current=
    Number.isFinite(value)
    ?String(
        Number(
          value.toPrecision(12)
        )
      )
    :"Error";

  previous=null;
  operator=null;
  waiting=true;

  update();

}


/* =========================
   CLEAR
========================= */

function clearAll(){

  current="0";
  previous=null;
  operator=null;
  waiting=false;

  expression.textContent="";
  expression.classList.remove("show");

  update();

}


/* =========================
   PLUS MINUS
========================= */

function plusMinus(){

  if(current==="0")
    return;

  current=
    current.startsWith("-")
    ?current.slice(1)
    :"-"+current;

  update();

}


/* =========================
   PERCENT
========================= */

function percent(){

  const value=
    Number(current)/100;

  current=String(value);

  update();

}


/* =========================
   OPERATOR SYMBOL
========================= */

function displayOperator(op){

  return {
    "+":"+",
    "-":"−",
    "*":"×",
    "/":"÷"
  }[op] || op;

}


/* =========================
   BUTTON EVENTS
========================= */

document
.querySelectorAll(".key")
.forEach(button=>{

  button.addEventListener(
    "pointerdown",
    ()=>{
      feedback(button);
    },
    {passive:true}
  );


  button.addEventListener(
    "click",
    ()=>{

      const value=
        button.dataset.value;

      const action=
        button.dataset.action;


      if(value){

        if(
          /^[0-9]$/.test(value)
        ){

          inputDigit(value);

        }else{

          chooseOperator(value);

        }

        return;
      }


      if(action==="decimal")
        decimal();

      else if(action==="clear")
        clearAll();

      else if(action==="plusminus")
        plusMinus();

      else if(action==="percent")
        percent();

      else if(action==="equals")
        equals();

    }

  );

});


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  event=>{

    const key=event.key;

    if(
      /^[0-9]$/.test(key)
    ){

      inputDigit(key);
      return;

    }

    if(key==="."){

      decimal();
      return;

    }

    if(
      ["+","-","*","/"].includes(key)
    ){

      chooseOperator(key);
      return;

    }

    if(
      key==="Enter" ||
      key==="="
    ){

      equals();
      return;

    }

    if(
      key==="Escape" ||
      key==="Delete"
    ){

      clearAll();
      return;

    }

    if(key==="%"){

      percent();

    }

  }
);


/* =========================
   INITIAL
========================= */

update();

</script>

</body>
</html>
