<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="description" content="A smooth full-screen liquid glass calculator.">

<link rel="manifest" href="/glass-calculator/manifest.json">

<title>Liquid Glass Calculator</title>

<style>
:root{
  --orange:#ff9f0a;
  --white:#fff;
  --muted:#8e8e93;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;

  color:#fff;

  /* Edge-to-edge */
  min-height:100dvh;
  height:100dvh;

  overscroll-behavior:none;
}

/* =========================
   APP
========================= */

.app{
  position:relative;

  width:100%;
  height:100dvh;
  min-height:100dvh;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(70,100,255,.13),
      transparent 31%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(145,70,255,.10),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #050507,
      #000 55%,
      #020203
    );

  isolation:isolate;
}

/* =========================
   LIQUID GLOW
========================= */

.glow{
  position:absolute;

  width:300px;
  height:300px;

  border-radius:50%;

  pointer-events:none;

  filter:blur(95px);

  opacity:.18;

  animation:
    liquidFloat
    10s ease-in-out infinite alternate;
}

.glow.one{
  left:-170px;
  top:-120px;
  background:#345cff;
}

.glow.two{
  right:-170px;
  bottom:-150px;
  background:#8c36ff;
  animation-delay:-4s;
}

@keyframes liquidFloat{

  0%{
    transform:
      translate3d(0,0,0)
      scale(1);
  }

  100%{
    transform:
      translate3d(35px,25px,0)
      scale(1.15);
  }
}

/* =========================
   CALCULATOR
========================= */

.calculator{
  position:relative;
  z-index:2;

  width:100%;
  height:100dvh;

  display:flex;
  flex-direction:column;

  padding:
    var(--safe-top)
    14px
    var(--safe-bottom)
    14px;
}

/* =========================
   DISPLAY
========================= */

.display{
  flex:1;

  min-height:0;

  display:flex;
  flex-direction:column;

  justify-content:flex-end;
  align-items:flex-end;

  padding:
    20px
    10px
    clamp(16px,4vh,38px);
}

.expression{
  width:100%;

  min-height:24px;

  text-align:right;

  color:#77777e;

  font-size:18px;
  font-weight:400;

  white-space:nowrap;

  overflow:hidden;
  text-overflow:ellipsis;

  opacity:0;

  transform:
    translateY(6px);

  transition:
    opacity .2s ease,
    transform .2s ease;
}

.expression.show{
  opacity:1;
  transform:none;
}

.result{
  width:100%;

  text-align:right;

  font-size:
    clamp(54px,15vw,92px);

  line-height:1;

  font-weight:300;

  letter-spacing:-2px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  transition:
    transform .14s ease;
}

.result.pop{
  animation:
    resultPop
    .18s
    ease;
}

@keyframes resultPop{

  0%{
    transform:scale(.965);
  }

  60%{
    transform:scale(1.025);
  }

  100%{
    transform:scale(1);
  }
}

/* =========================
   KEYPAD
========================= */

.keypad{
  flex:none;

  width:100%;
  max-width:520px;

  margin:0 auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:
    clamp(8px,2.5vw,14px);
}

/* =========================
   BUTTON
========================= */

.key{
  position:relative;

  width:100%;

  aspect-ratio:1;

  border:1px solid
    rgba(255,255,255,.055);

  outline:none;

  border-radius:50%;

  overflow:hidden;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.035)
    );

  box-shadow:
    inset 0 1px 0
      rgba(255,255,255,.12),

    inset 0 -8px 18px
      rgba(0,0,0,.22),

    0 7px 18px
      rgba(0,0,0,.32);

  backdrop-filter:
    blur(28px)
    saturate(155%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(155%);

  transition:
    transform .09s ease,
    background .12s ease,
    box-shadow .12s ease;
}

/* Glass reflection */

.key::before{
  content:"";

  position:absolute;

  width:72%;
  height:38%;

  left:-8%;
  top:-16%;

  border-radius:50%;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.18),
      transparent
    );

  filter:blur(8px);

  opacity:.45;

  pointer-events:none;
}

/* Ripple */

.key::after{
  content:"";

  position:absolute;

  width:20px;
  height:20px;

  left:50%;
  top:50%;

  margin-left:-10px;
  margin-top:-10px;

  border-radius:50%;

  background:
    rgba(255,255,255,.25);

  transform:scale(0);

  opacity:0;

  pointer-events:none;
}

.key.active{
  transform:scale(.91);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.22),
      rgba(255,255,255,.07)
    );

  box-shadow:
    inset 0 1px 0
      rgba(255,255,255,.18),

    0 2px 7px
      rgba(0,0,0,.4);
}

.key.active::after{
  animation:
    ripple
    .36s
    ease-out;
}

@keyframes ripple{

  0%{
    transform:scale(.2);
    opacity:.5;
  }

  100%{
    transform:scale(7);
    opacity:0;
  }
}

/* =========================
   TEXT
========================= */

.number{
  position:relative;
  z-index:2;

  font-size:
    clamp(26px,8vw,36px);

  font-weight:400;

  letter-spacing:-.4px;
}

/* =========================
   FUNCTION
========================= */

.function{
  color:#000;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.25),
      rgba(255,255,255,.10)
    );
}

.function .number{
  font-size:
    clamp(22px,6.5vw,30px);
}

/* =========================
   OPERATOR
========================= */

.operator{
  color:#fff;

  background:
    linear-gradient(
      145deg,
      #ffad22,
      #ff8b00
    );

  box-shadow:
    inset 0 1px 0
      rgba(255,255,255,.35),

    0 8px 24px
      rgba(255,159,10,.20);
}

.operator.active{
  color:var(--orange);

  background:#fff;

  box-shadow:
    0 5px 20px
      rgba(255,255,255,.20);
}

/* =========================
   BACKSPACE
========================= */

.backspace{
  color:#fff;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.15),
      rgba(255,255,255,.045)
    );
}

.backspace .number{
  font-size:
    clamp(24px,7vw,32px);

  font-weight:300;
}

/* =========================
   ZERO
========================= */

.zero{
  grid-column:span 2;

  aspect-ratio:auto;

  height:100%;

  min-height:0;

  border-radius:999px;

  justify-content:flex-start;

  padding-left:
    clamp(25px,7vw,35px);
}

/* =========================
   BOTTOM SPACE
========================= */

.bottom-space{
  height:6px;
  flex:none;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-height:650px){

  .display{
    padding-bottom:12px;
  }

  .keypad{
    gap:7px;
  }

  .calculator{
    padding-left:10px;
    padding-right:10px;
  }

}

/* =========================
   TABLET / LARGE
========================= */

@media(min-width:600px){

  .calculator{
    max-width:520px;
    margin:auto;
  }

}
</style>
</head>

<body>

<div class="app">

  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="calculator">

    <section class="display">

      <div
        id="expression"
        class="expression">
      </div>

      <div
        id="result"
        class="result">
        0
      </div>

    </section>


    <section class="keypad">

      <!-- TOP ROW -->

      <button
        class="key function"
        data-action="clear">
        <span class="number">AC</span>
      </button>

      <button
        class="key function"
        data-action="plusminus">
        <span class="number">±</span>
      </button>

      <button
        class="key function"
        data-action="percent">
        <span class="number">%</span>
      </button>

      <button
        class="key operator"
        data-value="/">
        <span class="number">÷</span>
      </button>


      <!-- ROW 2 -->

      <button class="key" data-value="7">
        <span class="number">7</span>
      </button>

      <button class="key" data-value="8">
        <span class="number">8</span>
      </button>

      <button class="key" data-value="9">
        <span class="number">9</span>
      </button>

      <button class="key operator" data-value="*">
        <span class="number">×</span>
      </button>


      <!-- ROW 3 -->

      <button class="key" data-value="4">
        <span class="number">4</span>
      </button>

      <button class="key" data-value="5">
        <span class="number">5</span>
      </button>

      <button class="key" data-value="6">
        <span class="number">6</span>
      </button>

      <button class="key operator" data-value="-">
        <span class="number">−</span>
      </button>


      <!-- ROW 4 -->

      <button class="key" data-value="1">
        <span class="number">1</span>
      </button>

      <button class="key" data-value="2">
        <span class="number">2</span>
      </button>

      <button class="key" data-value="3">
        <span class="number">3</span>
      </button>

      <button class="key operator" data-value="+">
        <span class="number">+</span>
      </button>


      <!-- BOTTOM ROW -->

      <button
        class="key zero"
        data-value="0">
        <span class="number">0</span>
      </button>

      <button
        class="key"
        data-action="decimal">
        <span class="number">.</span>
      </button>

      <button
        class="key operator"
        data-action="equals">
        <span class="number">=</span>
      </button>

      <!-- BACKSPACE ROW -->

      <button
        class="key backspace"
        data-action="backspace"
        style="display:none">
        <span class="number">⌫</span>
      </button>

    </section>

    <div class="bottom-space"></div>

  </main>

</div>


<script>

/* =========================
   STATE
========================= */

let current = "0";
let previous = null;
let operator = null;
let waiting = false;

const result =
  document.getElementById("result");

const expression =
  document.getElementById("expression");


/* =========================
   AUDIO
========================= */

let audioContext = null;

function clickSound(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type="sine";

    oscillator.frequency.setValueAtTime(
      165,
      audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      105,
      audioContext.currentTime + .035
    );

    gain.gain.setValueAtTime(
      .0001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .035,
      audioContext.currentTime + .004
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioContext.currentTime + .045
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + .05
    );

  }catch(error){}

}


/* =========================
   HAPTIC
========================= */

function haptic(){

  try{

    if(
      navigator.vibrate &&
      typeof navigator.vibrate === "function"
    ){

      navigator.vibrate(7);

    }

  }catch(error){}

}


/* =========================
   FEEDBACK
========================= */

function feedback(button){

  clickSound();
  haptic();

  button.classList.remove("active");

  void button.offsetWidth;

  button.classList.add("active");

  setTimeout(()=>{
    button.classList.remove("active");
  },130);

}


/* =========================
   DISPLAY
========================= */

function update(){

  result.textContent =
    formatNumber(current);

  result.classList.remove("pop");

  void result.offsetWidth;

  result.classList.add("pop");

}


/* =========================
   FORMAT
========================= */

function formatNumber(value){

  if(value==="Error")
    return value;

  if(value.includes("e"))
    return value;

  const num=Number(value);

  if(!Number.isFinite(num))
    return "Error";

  if(
    Math.abs(num)>=1e12 ||
    (
      Math.abs(num)<1e-7 &&
      num!==0
    )
  ){

    return num.toExponential(6);

  }

  if(value.includes(".")){
    return value;
  }

  return num.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:10
    }
  );

}


/* =========================
   DIGIT
========================= */

function inputDigit(digit){

  if(current==="Error"){
    current="0";
  }

  if(waiting){

    current=digit;
    waiting=false;

  }else{

    if(current==="0"){

      current=digit;

    }else if(current.length<15){

      current+=digit;

    }

  }

  update();

}


/* =========================
   DECIMAL
========================= */

function decimal(){

  if(waiting){

    current="0.";
    waiting=false;

  }else if(!current.includes(".")){

    current+=".";

  }

  update();

}


/* =========================
   BACKSPACE
========================= */

function backspace(){

  if(current==="Error"){

    clearAll();
    return;

  }

  if(waiting){

    return;

  }

  if(
    current.length<=1 ||
    (
      current.length===2 &&
      current.startsWith("-")
    )
  ){

    current="0";

  }else{

    current=
      current.slice(0,-1);

  }

  update();

}


/* =========================
   OPERATOR
========================= */

function chooseOperator(next){

  const input=
    Number(current);

  if(operator && waiting){

    operator=next;
    return;

  }

  if(previous===null){

    previous=input;

  }else if(operator){

    const value=
      calculate(
        previous,
        input,
        operator
      );

    current=
      Number.isFinite(value)
      ?String(value)
      :"Error";

    previous=value;

    update();

  }

  operator=next;
  waiting=true;

  expression.textContent=
    formatNumber(String(previous))
    +" "
    +displayOperator(next);

  expression.classList.add("show");

}


/* =========================
   CALCULATE
========================= */

function calculate(a,b,op){

  switch(op){

    case "+":
      return a+b;

    case "-":
      return a-b;

    case "*":
      return a*b;

    case "/":
      return b===0
        ?NaN
        :a/b;

    default:
      return b;

  }

}


/* =========================
   EQUALS
========================= */

function equals(){

  if(
    operator===null ||
    previous===null
  ){

    return;

  }

  const a=previous;
  const b=Number(current);

  const value=
    calculate(
      a,
      b,
      operator
    );

  expression.textContent=
    formatNumber(String(a))
    +" "
    +displayOperator(operator)
    +" "
    +formatNumber(String(b))
    +" =";

  expression.classList.add("show");

  current=
    Number.isFinite(value)
    ?String(
      Number(
        value.toPrecision(12)
      )
    )
    :"Error";

  previous=null;
  operator=null;
  waiting=true;

  update();

}


/* =========================
   CLEAR
========================= */

function clearAll(){

  current="0";
  previous=null;
  operator=null;
  waiting=false;

  expression.textContent="";

  expression.classList.remove("show");

  update();

}


/* =========================
   PLUS MINUS
========================= */

function plusMinus(){

  if(current==="0")
    return;

  current=
    current.startsWith("-")
    ?current.slice(1)
    :"-"+current;

  update();

}


/* =========================
   PERCENT
========================= */

function percent(){

  const value=
    Number(current)/100;

  current=String(value);

  update();

}


/* =========================
   SYMBOL
========================= */

function displayOperator(op){

  return {
    "+":"+",
    "-":"−",
    "*":"×",
    "/":"÷"
  }[op] || op;

}


/* =========================
   BUTTONS
========================= */

document
.querySelectorAll(".key")
.forEach(button=>{

  button.addEventListener(
    "pointerdown",
    ()=>{
      feedback(button);
    },
    {passive:true}
  );


  button.addEventListener(
    "click",
    ()=>{

      const value=
        button.dataset.value;

      const action=
        button.dataset.action;


      if(value){

        if(
          /^[0-9]$/.test(value)
        ){

          inputDigit(value);

        }else{

          chooseOperator(value);

        }

        return;

      }


      if(action==="decimal")
        decimal();

      else if(action==="clear")
        clearAll();

      else if(action==="plusminus")
        plusMinus();

      else if(action==="percent")
        percent();

      else if(action==="equals")
        equals();

      else if(action==="backspace")
        backspace();

    }

  );

});


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  event=>{

    const key=event.key;

    if(/^[0-9]$/.test(key)){

      inputDigit(key);
      return;

    }

    if(key==="."){

      decimal();
      return;

    }

    if(
      ["+","-","*","/"].includes(key)
    ){

      chooseOperator(key);
      return;

    }

    if(
      key==="Enter" ||
      key==="="
    ){

      equals();
      return;

    }

    if(
      key==="Escape" ||
      key==="Delete"
    ){

      clearAll();
      return;

    }

    if(
      key==="Backspace"
    ){

      backspace();
      return;

    }

    if(key==="%"){

      percent();

    }

  }
);


/* =========================
   START
========================= */

update();

</script>

</body>
</html>
